version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: happy-emborji-backend:latest
    # ports:
    #   - "8021:8021"
    env_file:
      - .env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`happy-backend.dev.aritraghorai.in`)"
      - "traefik.http.services.backend.loadbalancer.server.port=8021"
    # environment:
    #   # default MONGO_URI for local compose networking
    #   - MONGO_URI=mongodb://mongo:27017/happy-emborji
    # depends_on:
    #   - mongo
    restart: unless-stopped
    networks:
      - proxy-network

  # mongo:
  #   image: mongo:6.0
  #   restart: unless-stopped
  #   volumes:
  #     - mongo-data:/data/db
  #   ports:
  #     - "27017:27017"

volumes:
  mongo-data:

networks:
  proxy-network:
    external: true # This tells Docker to use an existing network instead of creating a new one
